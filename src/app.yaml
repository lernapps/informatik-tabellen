format: 2
strand: informatik/daten
title:
  de: Rechnen mit Tabellen
  en: Calculating with spreadsheets
intro:
  de: >-
    Die Klasse 9b macht die Kasse des Schulfests. Selin baut dafür ein Rechenblatt, Jona zählt, Mia prüft nach. Du
    rechnest mit: erst mit Zahlen, Texten und Wahrheitswerten, dann mit Formeln und Bezügen, am Ende mit Funktionen
    und einem Datenflussdiagramm.
  en: >-
    Class 9b is running the till at the school fair. Selin builds a spreadsheet for it, Jona counts and Mia checks. You
    work along with them: first with numbers, text and Boolean values, then with formulas and references, and at the
    end with functions and a data flow diagram.
languages: [de, en]
